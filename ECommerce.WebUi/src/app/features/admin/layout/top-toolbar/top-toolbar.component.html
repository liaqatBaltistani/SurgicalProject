<header class="top-toolbar">
  <div class="toolbar-left">
    <button mat-icon-button class="menu-button" (click)="onSidebarToggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <admin-search-bar placeholder="Search anything..."></admin-search-bar>
  </div>

  <div class="toolbar-right">
    <div class="toolbar-actions">
      <button mat-icon-button class="action-button" (click)="onNotificationClick()">
        <mat-icon>notifications</mat-icon>
        <span *ngIf="notificationCount > 0" class="badge">{{ notificationCount }}</span>
      </button>

      <button mat-icon-button class="action-button" (click)="onMessageClick()">
        <mat-icon>mail</mat-icon>
        <span *ngIf="messageCount > 0" class="badge">{{ messageCount }}</span>
      </button>
    </div>

    <div class="user-menu" (document:click)="closeProfileMenu()">
      <button mat-button class="user-button" (click)="toggleProfileMenu()">
        <div *ngIf="userAvatar" class="user-avatar">
          <img [src]="userAvatar" [alt]="userName" />
        </div>
        <div *ngIf="!userAvatar" class="user-avatar-placeholder">
          <mat-icon>person</mat-icon>
        </div>
        <span class="user-name">{{ userName }}</span>
        <mat-icon class="dropdown-icon">expand_more</mat-icon>
      </button>

      <div *ngIf="profileMenuOpen" class="profile-dropdown">
        <div class="dropdown-header">
          <div class="dropdown-avatar">
            <img *ngIf="userAvatar" [src]="userAvatar" [alt]="userName" />
            <mat-icon *ngIf="!userAvatar">person</mat-icon>
          </div>
          <div class="dropdown-info">
            <div class="dropdown-name">{{ userName }}</div>
            <div class="dropdown-role">Administrator</div>
          </div>
        </div>
        <div class="dropdown-menu">
          <button mat-button class="dropdown-item" (click)="onProfileClick()">
            <mat-icon>account_circle</mat-icon>
            <span>Profile</span>
          </button>
          <button mat-button class="dropdown-item">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </button>
          <div class="dropdown-divider"></div>
          <button mat-button class="dropdown-item danger" (click)="onLogout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
