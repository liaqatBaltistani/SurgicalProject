<div class="confirmation-dialog">
  <div class="dialog-header">
    <mat-icon *ngIf="data.isDestructive" class="warning-icon">warning</mat-icon>
    <mat-icon *ngIf="!data.isDestructive" class="info-icon">info</mat-icon>
    <h2 class="dialog-title">{{ data.title }}</h2>
  </div>
  <div class="dialog-content">
    <p class="dialog-message">{{ data.message }}</p>
  </div>
  <div class="dialog-actions">
    <button mat-button class="cancel-button" (click)="onCancel()">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button
      mat-raised-button
      [class.destructive]="data.isDestructive"
      class="confirm-button"
      (click)="onConfirm()"
    >
      {{ data.confirmText || 'Confirm' }}
    </button>
  </div>
</div>
