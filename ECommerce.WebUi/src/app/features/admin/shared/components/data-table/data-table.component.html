<div class="data-table">
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
      <!-- Select column -->
      <ng-container matColumnDef="select" *ngIf="selectable">
        <th mat-header-cell *matHeaderCellDef class="select-column">
          <mat-checkbox
            [checked]="isAllSelected()"
            [indeterminate]="isSomeSelected()"
            (change)="onSelectAll($event)"
          ></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row" class="select-column">
          <mat-checkbox
            [checked]="isRowSelected(row)"
            (change)="onRowSelect(row, $event)"
            (click)="$event.stopPropagation()"
          ></mat-checkbox>
        </td>
      </ng-container>

      <!-- Data columns -->
      <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
        <th
          mat-header-cell
          *matHeaderCellDef
          [class.sortable]="isColumnSortable(column)"
          [style.width]="column.width"
          [style.text-align]="column.align || 'left'"
        >
          {{ column.label }}
          <mat-icon *ngIf="isColumnSortable(column)" class="sort-icon">sort</mat-icon>
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          [style.text-align]="column.align || 'left'"
          (click)="onRowClick(row)"
        >
          <ng-container [ngSwitch]="column.type">
            <!-- Image type -->
            <img
              *ngSwitchCase="'image'"
              [src]="getCellValue(row, column)"
              [alt]="column.label"
              class="cell-image"
            />

            <!-- Badge type -->
            <admin-status-badge
              *ngSwitchCase="'badge'"
              [status]="getCellValue(row, column)"
            ></admin-status-badge>

            <!-- Default text type -->
            <span *ngSwitchDefault>{{ getCellValue(row, column) }}</span>
          </ng-container>
        </td>
      </ng-container>

      <!-- Actions column -->
      <ng-container matColumnDef="actions" *ngIf="showActions">
        <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-column">
          <admin-action-menu
            [items]="actions"
            (actionClick)="onActionClick($event, row)"
          ></admin-action-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="onRowClick(row)"
        [class.selectable]="!selectable"
      ></tr>
    </table>

    <!-- Loading state -->
    <div *ngIf="loading" class="table-loading">
      <admin-skeleton-loader type="table-row" [count]="columns.length + (selectable ? 1 : 0) + (showActions ? 1 : 0)"></admin-skeleton-loader>
      <admin-skeleton-loader type="table-row" [count]="columns.length + (selectable ? 1 : 0) + (showActions ? 1 : 0)"></admin-skeleton-loader>
      <admin-skeleton-loader type="table-row" [count]="columns.length + (selectable ? 1 : 0) + (showActions ? 1 : 0)"></admin-skeleton-loader>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && (!data || data.length === 0)" class="table-empty">
      <admin-empty-state
        icon="table_chart"
        title="No data available"
        description="There are no records to display."
      ></admin-empty-state>
    </div>
  </div>

  <!-- Pagination -->
  <div *ngIf="totalItems > 0" class="table-pagination">
    <admin-pagination
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [totalItems]="totalItems"
      (pageChange)="pageChange.emit({ page: $event, size: pageSize })"
      (pageSizeChange)="pageChange.emit({ page: currentPage, size: $event })"
    ></admin-pagination>
  </div>
</div>
