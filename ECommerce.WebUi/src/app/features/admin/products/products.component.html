<div class="products">
  <admin-page-header
    title="Products"
    subtitle="Manage your product inventory"
    actionText="Add Product"
    [showAction]="true"
    (actionClick)="onAddProduct()"
  ></admin-page-header>

  <admin-toolbar
    [showSearch]="true"
    [showFilter]="true"
    [showExport]="true"
    [showRefresh]="true"
    (export)="onExport()"
    (refresh)="onRefresh()"
  ></admin-toolbar>

  <admin-data-table
    [columns]="columns"
    [data]="products()"
    [loading]="loading()"
    [selectable]="true"
    [showActions]="true"
    [totalItems]="totalItems()"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    [actions]="[
      { label: 'View', icon: 'visibility', action: 'view' },
      { label: 'Edit', icon: 'edit', action: 'edit' },
      { label: 'Delete', icon: 'delete', action: 'delete', color: 'warn' }
    ]"
    (actionClick)="onAction($event)"
    (pageChange)="onPageChange($event.page)"
  ></admin-data-table>
</div>
